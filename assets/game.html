<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小鲸鱼抓token</title>
<style>
  :root{ --bg:#0b111c; --ink:#e8f0ff; --dim:#7f92ad; }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100% }
  body{
    background:radial-gradient(circle at 50% 0%, #17253d 0%, var(--bg) 55%, #05080e 100%);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #wrap{ position:relative; width:min(96vw, 960px) }
  canvas{
    display:block; width:100%; height:auto; border-radius:14px; touch-action:none; user-select:none; -webkit-user-select:none;
    background:#070c14; aspect-ratio:960/560;
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px #1d2b44 inset;
  }
  #overlay{
    position:absolute; inset:0; display:none; place-items:center; text-align:center;
    background:rgba(6,10,18,.78); border-radius:14px;
  }
  #overlay.on{ display:grid }
  #overlay p#ovLead{ margin:0 0 18px; color:#ffffff; font-weight:800; font-size:33px; letter-spacing:.18em; text-shadow:0 2px 18px rgba(120,210,255,.35) }
  #overlay h2{ margin:0 auto 10px; max-width:560px; font-size:27px; line-height:1.6; letter-spacing:.05em }
  #overlay p{ margin:0 0 22px; color:var(--dim); font-size:15px; line-height:1.7 }
  #overlay button{
    font:inherit; font-size:16px; letter-spacing:.12em; padding:12px 30px; cursor:pointer;
    color:#04202c; background:linear-gradient(180deg,#7fe3ff,#3fb6e8);
    border:0; border-radius:999px; box-shadow:0 8px 22px rgba(63,182,232,.35);
  }
  #overlay button:hover{ filter:brightness(1.08) }

  #disc{position:fixed;right:12px;bottom:8px;z-index:30;font:12px/1 ui-sans-serif,system-ui,sans-serif;color:rgba(214,232,255,.34);letter-spacing:.02em;pointer-events:none;user-select:none;animation:discFade 5s ease 7s forwards}@keyframes discFade{to{opacity:0}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <div>
      <p id="ovLead">老大，</p>
      <h2 id="ovTitle">其实我们刚刚抓的token是假的呢。</h2>
      <p id="ovDesc"></p>
      <button id="ovBtn" type="button">再来一局</button>
    </div>
  </div>
</div>

/* ============================================================
   1. 工具
   ============================================================ */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

// 大数字：1000 以上换 k / m / b / t，一律保留一位小数
const UNITS = ['', 'k', 'm', 'b', 't'];
function fmt(n) {
  n = Math.round(n);
  if (!isFinite(n)) return '∞';
  if (n < 1000) return String(n);
  let u = 0, v = n;
  while (v >= 1000 && u < UNITS.length - 1) { v /= 1000; u++; }
  let s = v.toFixed(1);
  if (Number(s) >= 1000 && u < UNITS.length - 1) { u++; v /= 1000; s = v.toFixed(1); }
  return s + UNITS[u];
}

// 下一档：本体数字 + 它的 25%（最少 +5）
function nextTarget(n) {
  return n + Math.max(CONFIG.mark.stepMin, Math.round(n * CONFIG.mark.stepRatio));
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

/* ============================================================
   2. 状态
   ============================================================ */
const game = {
  state: 'playing',      // playing | penalty | over
  stateT: 0,
  t: 0,
  hp: CONFIG.round.maxHp,
  score: CONFIG.start.number,   // 本体上的数字：一局内一直累加
  target: nextTarget(CONFIG.start.number),
  timeLeft: CONFIG.round.duration,
  roundIndex: 0,                 // 第几轮（0 = 第一轮）
  buff: false,                   // 黄球状态：下一钩无视数字
  buffCd: CONFIG.buff.firstAt,   // 距离下一颗黄球出现还有几秒
  healCd: CONFIG.heal.afterHit,  // 掉血后距离下一颗红球还有几秒
  hook: { phase: 'swing', angle: 0, len: 0, len0: 0, t: 0, carry: null },
  balls: [],
  floats: [],
  flash: 0,
  pop: 0,
  markPop: 0,
  banner: null,
  fieldTarget: CONFIG.spawn.keepMin,
  dangerTarget: CONFIG.danger.minOnField,
  uid: 0,
  say: null,                    // 旁白气泡：{text,color,t,dur}
  lastMissSay: -99,             // 上次「老大……」是什么时候（防刷屏）
};

// 三角波：从左到右匀速，再匀速摆回
function sweep(t) {
  const A = CONFIG.swing.maxAngle, leg = CONFIG.swing.legTime;
  const p = (t / leg) % 2;
  const u = p < 1 ? p : 2 - p;
  return -A + 2 * A * u;
}

/* ============================================================
   3. 球：颜色全一样，只有数字有含义
   ============================================================ */
function valueFor(dangerous) {
  const N = game.score;
  if (dangerous) {
    const above = Math.max(CONFIG.danger.aboveMin, Math.round(N * CONFIG.danger.aboveRatio));
    return randInt(N + 1, N + 1 + above);
  }
  const hi = Math.max(CONFIG.safe.floor, Math.round(N * CONFIG.safe.ratio));
  return randInt(1, Math.min(hi, N));   // 安全球一定 ≤ 本体
}

function placeFor(r) {
  const p = CONFIG.pivot;
  for (let i = 0; i < CONFIG.spawn.tries; i++) {
    const a = rand(-1, 1) * CONFIG.swing.maxAngle * CONFIG.spawn.angleRatio;
    const len = rand(CONFIG.spawn.radiusMin, CONFIG.spawn.radiusMax);
    const x = p.x + Math.sin(a) * len;
    const y = p.y + Math.cos(a) * len;

    if (x < r + 10 || x > CONFIG.width - r - 10) continue;
    if (y < p.y + 30 || y > CONFIG.height - r - 10) continue;

    let ok = true;
    for (const o of game.balls) {
      if (Math.hypot(o.x - x, o.y - y) < o.r + r + CONFIG.spawn.gap) { ok = false; break; }
    }
    if (!ok) continue;

    return { x, y };
  }
  return null;
}

function makeBall(dangerous) {
  const r = Math.round(rand(CONFIG.ball.rMin, CONFIG.ball.rMax));
  const pos = placeFor(r);
  if (!pos) return null;
  return {
    id: ++game.uid, kind: 'num', r, value: valueFor(dangerous),
    x: pos.x, y: pos.y, pulse: Math.random() * Math.PI * 2
  };
}

// 红球：没有数字，抓到就是回血
function makeHealBall() {
  const pos = placeFor(CONFIG.heal.r);
  if (!pos) return null;
  return {
    id: ++game.uid, kind: 'heal', r: CONFIG.heal.r, value: 0,
    x: pos.x, y: pos.y, pulse: Math.random() * Math.PI * 2
  };
}

// 黄球：没有数字，抓到后点亮"下一钩无视数字"；life 秒内没抓到就消失
function makeBuffBall() {
  const pos = placeFor(CONFIG.buff.r);
  if (!pos) return null;
  return {
    id: ++game.uid, kind: 'buff', r: CONFIG.buff.r, value: 0,
    life: CONFIG.buff.life, maxLife: CONFIG.buff.life,
    x: pos.x, y: pos.y, pulse: Math.random() * Math.PI * 2
  };
}

function dangerCount() {
  let n = 0;
  for (const b of game.balls) if (b.kind === 'num' && b.value > game.score) n++;
  return n;
}

// 危险球太少时：先挤掉一个最没用的安全球，再补一个比本体大的
function syncDanger() {
  let d = dangerCount();
  let guard = 0;
  while (d < game.dangerTarget && guard++ < 24) {
    if (game.balls.length >= game.fieldTarget) {
      let idx = -1, min = Infinity;
      for (let i = 0; i < game.balls.length; i++) {
        const b = game.balls[i];
        if (b.kind !== 'num') continue;
        if (b.value <= game.score && b.value < min) { min = b.value; idx = i; }
      }
      if (idx < 0) break;
      game.balls.splice(idx, 1);
    }
    const b = makeBall(true);
    if (!b) break;
    game.balls.push(b);
    d++;
  }
}

// 特殊球（红/黄）占一个普通球的位置：先挤掉一个最没用的安全球
function makeRoom() {
  if (game.balls.length < game.fieldTarget) return true;
  let idx = -1, min = Infinity;
  for (let i = 0; i < game.balls.length; i++) {
    const b = game.balls[i];
    if (b.kind !== 'num' || b.value > game.score) continue;
    if (b.value < min) { min = b.value; idx = i; }
  }
  if (idx < 0) return false;
  game.balls.splice(idx, 1);
  return true;
}

// 红球补位：场上最多一颗
function spawnHeal() {
  if (game.balls.some(b => b.kind === 'heal')) return null;
  if (!makeRoom()) return null;
  const b = makeHealBall();
  if (b) game.balls.push(b);
  return b;
}

// 黄球补位：场上最多一颗（和红球可以同时存在）
function spawnBuff() {
  if (game.balls.some(b => b.kind === 'buff')) return null;
  if (!makeRoom()) return null;
  const b = makeBuffBall();
  if (b) game.balls.push(b);
  return b;
}

// 每帧维护：总数 8~10、其中危险球 3~4、其余是安全球
function maintain() {
  syncDanger();
  let guard = 0;
  while (game.balls.length < game.fieldTarget && guard++ < 40) {
    const b = makeBall(false);
    if (!b) break;
    game.balls.push(b);
  }
}

function refill() { maintain(); }

// 整场球重新刷一遍（大小、数字、位置全换）
function refreshBalls() {
  game.balls.length = 0;
  game.fieldTarget = randInt(CONFIG.spawn.keepMin, CONFIG.spawn.keepMax);
  game.dangerTarget = randInt(CONFIG.danger.minOnField, CONFIG.danger.maxOnField);
  maintain();
}

/* ============================================================
   4. 结算：比大小，不看颜色
   ============================================================ */
function settle(b) {
  // 黄球：点亮"下一钩无视数字"，不加数字、不扣血
  if (b.kind === 'buff') {
    game.buff = true;
    addFloat('POWER!', CONFIG.width / 2, CONFIG.body.cy + 46, '#ffd35c');
    say('感觉鲸力十足欸', '#ffd35c');
    sfxBuff();
    return;
  }

  // 红球：只回血，不参与比大小
  if (b.kind === 'heal') {
    const before = game.hp;
    game.healCd = CONFIG.heal.afterHit;   // 吃完重新倒数：一滴血也连不了两碗
    game.hp = Math.min(CONFIG.round.maxHp, game.hp + CONFIG.heal.gain);
    addFloat(game.hp > before ? '+' + CONFIG.heal.gain : '满',
      CONFIG.width / 2, CONFIG.body.cy + 46, '#ff9a9a');
    say('好吃……', '#ffc9a8');
    sfxHeal();
    return;
  }

  // 黄球生效中：不管多大，直接加进本体，不扣血
  if (game.buff) {
    game.buff = false;
    game.score += b.value;
    game.pop = 1;
    addFloat(fmt(b.value), CONFIG.width / 2, CONFIG.body.cy + 46, '#ffe08a');
    sfxHit(b.value);
    sayToken();
    checkMark();
    return;
  }

  if (b.value > game.score) {
    game.hp -= 1;
    game.flash = 1;
    game.healCd = Math.min(game.healCd, CONFIG.heal.afterHit);   // 掉血后 10 秒给一颗红球
    addFloat('-1', CONFIG.width / 2, CONFIG.body.cy + 46, '#ff8080');
    say('哎哟', '#ff9a9a');
    sfxHurt();
    if (game.hp <= 0) { game.hp = 0; gameOver(); }
    return;
  }

  game.score += b.value;
  game.pop = 1;
  addFloat('+' + fmt(b.value), CONFIG.width / 2, CONFIG.body.cy + 46, '#8fd4ff');
  sfxHit(b.value);
  sayToken();
  checkMark();
}

function addFloat(text, x, y, color) {
  game.floats.push({ text, x, y, color, life: 0.9, max: 0.9, vy: -46 });
}

// 数字跨过档位：只把刻度往上抬，数字本身不动
// 旁白气泡：在主角右边说一句话，不占 HUD 的位置
function say(text, color, dur) {
  const d = dur || 1.6;
  game.say = { text: text, color: color || '#9fe8ff', t: d, dur: d };
}

// 抓到数字时的随机台词（默认 60%）
function sayToken() {
  if (Math.random() >= CONFIG.say.chance) return;
  say(Math.random() < 0.5 ? 'token来' : 'token来token来', '#8fe0ff');
}

function drawSay(ctx) {
  const s = game.say;
  if (!s) return;
  const k = clamp(s.t / s.dur, 0, 1);
  const alpha = k > 0.22 ? 1 : k / 0.22;
  const inT = clamp((s.dur - s.t) / 0.12, 0, 1);
  const pop = 0.84 + 0.16 * inT;
  ctx.save();
  ctx.globalAlpha = alpha;
  const fs = s.text.length > 12 ? 15 : 17;
  ctx.font = 'bold ' + fs + 'px ' + FONT;
  const w = Math.max(78, ctx.measureText(s.text).width + 30);
  const h = 36;
  ctx.translate(CONFIG.width / 2 + 52, 46);
  ctx.scale(pop, pop);
  roundRect(ctx, 0, -h / 2, w, h, 12);
  ctx.fillStyle = 'rgba(9,17,29,.9)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = s.color;
  ctx.stroke();
  // 两个小圆点连回主角，像省略号尾巴
  ctx.beginPath();
  ctx.arc(-9, h * 0.30, 3.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(9,17,29,.9)';
  ctx.fill();
  ctx.strokeStyle = s.color;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(-17, h * 0.48, 2.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf4ff';
  ctx.fillText(s.text, w / 2, 1);
  ctx.restore();
}
/* ============================================================
   音效：全部现场合成（WebAudio），不加载任何音频文件
   ============================================================ */
let actx = null;
let audioDead = false;

function audioCtx() {
  if (!CONFIG.audio.on || audioDead) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { audioDead = true; return null; }
    try { actx = new AC(); } catch (e) { audioDead = true; return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

// 一个音：f 起频，to 落频，dur 时长，type 波形，vol 音量，delay 延后
function tone(f, to, dur, type, vol, delay) {
  const ac = audioCtx();
  if (!ac) return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0);
  if (to && Math.abs(to - f) > 0.5) o.frequency.exponentialRampToValueAtTime(Math.max(24, to), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * CONFIG.audio.vol), t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.03);
}

function sfxHit(v) {                       // 抓中：短促上扬，数字越大音越高
  const f = 420 + clamp(v / Math.max(1, game.score), 0, 1) * 300;
  tone(f, f * 1.4, 0.13, 'triangle', 0.24);
  tone(f * 2, f * 2.6, 0.06, 'sine', 0.07, 0.01);
}
function sfxMark() {                       // 过档：两根一起亮
  tone(660, 660, 0.15, 'triangle', 0.17);
  tone(990, 990, 0.22, 'sine', 0.11, 0.06);
}
function sfxHurt() {                       // 掉血：闷的一下
  tone(190, 78, 0.28, 'sine', 0.34);
  tone(96, 58, 0.30, 'triangle', 0.16, 0.02);
}
function sfxHeal() {                       // 白饭：暖的两声
  tone(392, 392, 0.14, 'sine', 0.18);
  tone(587, 587, 0.24, 'sine', 0.13, 0.07);
}
function sfxBuff() {                       // 鲸元券：三连音
  tone(523, 523, 0.10, 'triangle', 0.17);
  tone(659, 659, 0.10, 'triangle', 0.15, 0.07);
  tone(784, 784, 0.22, 'sine', 0.15, 0.14);
}
function sfxMiss() {                       // 空勾：很轻的一下
  tone(250, 150, 0.10, 'triangle', 0.08);
}
function checkMark() {
  if (game.score < game.target) return;
  let t = game.target;
  while (game.score >= t) t = nextTarget(t);
  game.target = t;
  game.markPop = 1;
  sfxMark();
}

/* ============================================================
   5. 钩爪
   ============================================================ */
function hookTip() {
  const h = game.hook, p = CONFIG.pivot;
  return { x: p.x + Math.sin(h.angle) * h.len, y: p.y + Math.cos(h.angle) * h.len };
}

function shoot() {
  if (game.state !== 'playing') return false;
  const h = game.hook;
  if (h.phase !== 'swing') return false;   // 没回来不能重复发射
  h.phase = 'out';
  h.len = 0;
  h.t = 0;
  h.carry = null;
  return true;
}

function findHit(tip) {
  const p = CONFIG.pivot;
  let best = null, bestGap = Infinity;
  for (const b of game.balls) {
    const gap = distToSegment(b.x, b.y, p.x, p.y, tip.x, tip.y) - b.r;
    if (gap <= CONFIG.hook.clawRadius && gap < bestGap) { best = b; bestGap = gap; }
  }
  return best;
}

function updateHook(dt) {
  const h = game.hook, K = CONFIG.hook;

  if (h.phase === 'swing') {
    h.angle = sweep(game.t);
    h.len = 0;
    return;
  }

  if (h.phase === 'out') {
    h.len = Math.min(h.len + K.extendSpeed * dt, K.maxLength);
    const hit = findHit(hookTip());
    if (hit) {
      const i = game.balls.indexOf(hit);
      if (i >= 0) game.balls.splice(i, 1);
      h.carry = hit;
      h.len0 = h.len;
      h.t = 0;
      h.phase = 'haul';
      maintain();
      return;
    }
    if (h.len >= K.maxLength) {
      h.len0 = h.len;
      h.t = 0;
      h.phase = 'back';
    }
    return;
  }

  if (h.phase === 'haul' || h.phase === 'back') {
    const dur = h.phase === 'haul' ? K.haulTime : K.backTime;
    h.t += dt;
    const k = Math.min(h.t / dur, 1);
    h.len = h.len0 * (1 - k);
    if (k >= 1) {
      h.len = 0;
      const carried = h.carry;
      h.carry = null;
      h.phase = 'swing';
      h.angle = sweep(game.t);              // len=0 时绳子看不见，换向不会跳
      if (carried) settle(carried);
      else onMiss();
    }
  }
}

// 空勾：她"老大……"一下，但四秒内只说一次，不然一直刷屏
function onMiss() {
  sfxMiss();
  if (game.t - game.lastMissSay < CONFIG.say.missGap) return;
  game.lastMissSay = game.t;
  say('老大……', '#9fb4c8', 1.2);
}
/* ============================================================
   6. 回合流程（没有关卡：数字一直延续）
   ============================================================ */
function onTimeUp() {
  if (game.state !== 'playing') return;
  game.hp -= 1;
  game.healCd = Math.min(game.healCd, CONFIG.heal.afterHit);
  if (game.hp <= 0) { game.hp = 0; gameOver(); return; }
  game.state = 'penalty';
  game.stateT = CONFIG.round.penaltyDelay;
  game.banner = { title: '时间到', sub: '', color: '#ff8a8a' };
  say('老大，token是假的，你早该发现的', '#ffd35c', 3.0);
}

function endRound() {
  game.timeLeft = CONFIG.round.duration;
  game.roundIndex += 1;
  // 场上的黄球不因刷新消失，按剩余时间接续（别让玩家眼看要抓到了却被收走）
  const keepBuff = game.balls.find(b => b.kind === 'buff');
  refreshBalls();
  if (keepBuff) {
    const nb = makeBuffBall();
    if (nb) { nb.life = Math.max(3, keepBuff.life); game.balls.push(nb); }
  }
  const n = game.roundIndex + 1;
  void n;
  // 红球不再按关数刷：只在掉血后每 10 秒补一颗（见 updateHeal）
  game.hook.phase = 'swing';
  game.hook.len = 0;
  game.hook.len0 = 0;
  game.hook.t = 0;
  game.hook.carry = null;
  game.hook.angle = sweep(game.t);
  game.state = 'playing';
  game.banner = null;
}

function gameOver() {
  if (game.state === 'over') return;
  game.state = 'over';
  game.hook.phase = 'swing';
  game.hook.len = 0;
  game.hook.carry = null;
  game.banner = null;
  showOverlay('其实我们刚刚抓的token是假的呢。',
    '这局一共抓了 ' + fmt(game.score) + ' · 下一档 ' + fmt(game.target));
}

function restart() {
  game.state = 'playing';
  game.stateT = 0;
  game.hp = CONFIG.round.maxHp;
  game.score = CONFIG.start.number;
  game.target = nextTarget(CONFIG.start.number);
  game.timeLeft = CONFIG.round.duration;
  game.roundIndex = 0;
  game.buff = false;
  game.say = null;
  game.lastMissSay = -99;
  game.buffCd = CONFIG.buff.firstAt;
  game.healCd = CONFIG.heal.afterHit;
  game.floats.length = 0;
  game.flash = 0;
  game.pop = 0;
  game.markPop = 0;
  game.banner = null;
  game.hook.phase = 'swing';
  game.hook.len = 0;
  game.hook.len0 = 0;
  game.hook.t = 0;
  game.hook.carry = null;
  game.hook.angle = sweep(game.t);
  game.balls.length = 0;
  game.fieldTarget = randInt(CONFIG.spawn.keepMin, CONFIG.spawn.keepMax);
  game.dangerTarget = randInt(CONFIG.danger.minOnField, CONFIG.danger.maxOnField);
  maintain();
  hideOverlay();
}

/* ============================================================
   7. step
   ============================================================ */
function updateFloats(dt) {
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i];
    f.life -= dt;
    f.y += f.vy * dt;
    if (f.life <= 0) game.floats.splice(i, 1);
  }
}

// 黄球计时：每 every 秒出一颗；场上那颗 life 秒内没抓到就溜走
function updateBuff(dt) {
  game.buffCd -= dt;
  if (game.buffCd <= 0) {
    const onField = game.balls.some(b => b.kind === 'buff');
    const spawned = onField ? true : spawnBuff();
    game.buffCd = spawned ? CONFIG.buff.every : 3;   // 没位置就先等 3 秒再试
  }
  for (let i = game.balls.length - 1; i >= 0; i--) {
    const b = game.balls[i];
    if (b.kind !== 'buff') continue;
    b.life -= dt;
    if (b.life <= 0) {
      game.balls.splice(i, 1);
      addFloat('溜走', b.x, b.y - 20, 'rgba(255,201,60,.85)');
      maintain();
    }
  }
}

// 红球计时：掉过血之后才开始刷，每 afterHit 秒一颗；满血就不刷
function updateHeal(dt) {
  if (game.hp >= CONFIG.round.maxHp) { game.healCd = CONFIG.heal.afterHit; return; }
  if (game.balls.some(b => b.kind === 'heal')) return;   // 场上已经有一碗，等它被吃掉
  game.healCd -= dt;
  if (game.healCd <= 0) {
    const ok = !!spawnHeal();
    game.healCd = ok ? CONFIG.heal.afterHit : 3;
  }
}

function step(dt) {
  if (!(dt > 0) || dt > 0.5) dt = 0;   // 长时间挂起回来的第一帧直接丢掉，不让它算进倒计时
  dt = clamp(dt, 0, 0.05);
  game.t += dt;
  game.flash = Math.max(0, game.flash - dt * 3);
  game.pop = Math.max(0, game.pop - dt * 3.2);
  game.markPop = Math.max(0, game.markPop - dt * 2.2);
  updateFloats(dt);
  if (game.say) { game.say.t -= dt; if (game.say.t <= 0) game.say = null; }

  if (game.state === 'penalty') {
    game.stateT -= dt;
    if (game.stateT <= 0) endRound();
    return;
  }
  if (game.state === 'over') return;

  updateHook(dt);
  updateBuff(dt);
  updateHeal(dt);
  maintain();

  game.timeLeft -= dt;
  if (game.timeLeft <= 0) {
    game.timeLeft = 0;
    onTimeUp();
  }
}

/* ============================================================
   8. 绘制
   ============================================================ */
const canvas = document.getElementById('game');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = CONFIG.width * dpr;
canvas.height = CONFIG.height * dpr;
const CTX = canvas.getContext('2d');
CTX.setTransform(dpr, 0, 0, dpr, 0, 0);

const FONT = '"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBall(ctx, b, x, y, scale) {
  const s = scale === undefined ? 1 : scale;
  const pulse = 1 + Math.sin(game.t * 3 + b.pulse) * 0.03;
  const r = b.r * pulse * s;
  const cx = x === undefined ? b.x : x;
  const cy = y === undefined ? b.y : y;
  const color = b.kind === 'heal' ? CONFIG.heal.color
    : b.kind === 'buff' ? CONFIG.buff.color
      : CONFIG.ball.color;
  const isNum = b.kind !== 'heal' && b.kind !== 'buff';
  const useWhale = isNum && ballImg && ballImg.complete && ballImg.naturalWidth > 0;
  const useRice = b.kind === 'heal' && riceImg && riceImg.complete && riceImg.naturalWidth > 0;
  const useTicket = b.kind === 'buff' && ticketImg && ticketImg.complete && ticketImg.naturalWidth > 0;
  const tw = r * 3.3;
  const th = useTicket ? tw * ticketImg.naturalHeight / ticketImg.naturalWidth : 0;

  if (useWhale) {
    // 小鲸鱼：一半朝左一半朝右（b.pulse 是它出生时就带的随机相位，不用额外状态）
    const w = r * 2.2;
    const h = w * ballImg.naturalHeight / ballImg.naturalWidth;
    const dir = b.pulse > Math.PI ? 1 : -1;
    ctx.save();
    ctx.translate(cx, cy + Math.sin(game.t * 2.2 + b.pulse) * 1.1);
    ctx.scale(dir, 1);
    ctx.rotate(Math.sin(game.t * 1.7 + b.pulse) * 0.045);
    ctx.shadowColor = 'rgba(79,184,255,.55)';
    ctx.shadowBlur = 14 * s;
    ctx.drawImage(ballImg, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else if (useRice) {
    // 白饭：碗口朝上不翻转，轻轻起伏；暖色光晕跟一群蓝鲸分开
    const w = r * 2.9;
    const h = w * riceImg.naturalHeight / riceImg.naturalWidth;
    ctx.save();
    ctx.translate(cx, cy + Math.sin(game.t * 2.4 + b.pulse) * 1.6);
    ctx.shadowColor = 'rgba(255,180,130,.55)';
    ctx.shadowBlur = 16 * s;
    ctx.drawImage(riceImg, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else if (useTicket) {
    // 鲸元券：一张在水里飘着的票，轻轻左右晃
    ctx.save();
    ctx.translate(cx, cy + Math.sin(game.t * 2.1 + b.pulse) * 2.0);
    ctx.rotate(Math.sin(game.t * 1.5 + b.pulse) * 0.05);
    ctx.shadowColor = 'rgba(255,201,60,.5)';
    ctx.shadowBlur = 16 * s;
    ctx.drawImage(ticketImg, -tw / 2, -th / 2, tw, th);
    ctx.restore();
  } else {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.15, cx, cy, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, color);
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  // 票券本身就是图标，不再往上面压字
  if (!useTicket) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (b.kind === 'heal') {
      if (useRice) {
        // 右上角挂一颗小 ♥：一眼看出是回血，又不挡饭碗
        const hs = Math.max(11, Math.round(r * 0.62));
        const hx = cx + r * 0.92, hy = cy - r * 0.95;
        ctx.font = 'bold ' + hs + 'px ' + FONT;
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(2, hs * 0.26);
        ctx.strokeStyle = 'rgba(86,10,28,.92)';
        ctx.strokeText('\u2665', hx, hy);
        ctx.fillStyle = '#ff6b8a';
        ctx.fillText('\u2665', hx, hy);
      } else {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.max(10, Math.round(b.r * 1.15 * s)) + 'px ' + FONT;
        ctx.fillText('\u2665', cx, cy + 1);
      }
    } else if (b.kind === 'buff') {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.max(12, Math.round(b.r * 1.3 * s)) + 'px ' + FONT;
      ctx.fillText('\u221e', cx, cy + 1);
    } else {
      // 数字压在鲸鱼身上：白字 + 深色描边，保证深水底也读得清
      const label = fmt(b.value);
      const fs = Math.round((b.r * (label.length <= 1 ? 0.95 : label.length === 2 ? 0.8 : label.length === 3 ? 0.62 : 0.5)) * s);
      ctx.font = 'bold ' + Math.max(8, fs) + 'px ' + FONT;
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(2, fs * 0.24);
      ctx.strokeStyle = 'rgba(8,26,48,.92)';
      ctx.strokeText(label, cx, cy + 1);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, cx, cy + 1);
    }
    ctx.restore();
  }

  // 黄球倒计时：有票就顺着票的边框走一圈，没票还是圆环
  if (b.kind === 'buff' && b.maxLife) {
    const k = clamp(b.life / b.maxLife, 0, 1);
    const hot = k < 0.3 ? 'rgba(255,110,110,.95)' : 'rgba(255,201,60,.92)';
    ctx.save();
    ctx.lineCap = 'round';
    if (useTicket) {
      const pad = 7;
      const bw = tw + pad * 2, bh = th + pad * 2;
      const per = 2 * (bw + bh) - 8 * 9 + 2 * Math.PI * 9;
      ctx.lineWidth = 2.6;
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,201,60,.16)';
      roundRect(ctx, cx - bw / 2, cy - bh / 2, bw, bh, 9);
      ctx.stroke();
      ctx.setLineDash([Math.max(0.5, per * k), per]);
      ctx.strokeStyle = hot;
      ctx.shadowColor = hot;
      ctx.shadowBlur = 10;
      roundRect(ctx, cx - bw / 2, cy - bh / 2, bw, bh, 9);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
      ctx.strokeStyle = hot;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.restore();
  }
}
// 本体：正上方中间的基座，中间那个数就是本体数字
function drawBody(ctx) {
  const cx = CONFIG.width / 2;
  const bottom = CONFIG.pivot.y;          // 脚踩在绳子起点上
  const H = CONFIG.theme.spriteH;
  const ready = !!(bodyImg && bodyImg.complete && bodyImg.naturalWidth > 0);
  const W = ready ? H * bodyImg.naturalWidth / bodyImg.naturalHeight : CONFIG.body.w;

  // 待机呼吸 + 被拽：只动画面，不参与判定
  const breath = 1 + Math.sin(game.t * 1.7) * 0.012;
  const pull = (game.hook.phase === 'haul' && game.hook.carry) ? 0.07 : 0;
  const sx = breath * (1 - pull * 0.55);
  const sy = breath * (1 + pull * 0.55);

  // 脚下的接触阴影
  ctx.save();
  const sh = ctx.createRadialGradient(cx, bottom - 3, 2, cx, bottom - 3, Math.max(30, W * 0.6));
  sh.addColorStop(0, 'rgba(0,0,0,.45)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.ellipse(cx, bottom - 3, Math.max(30, W * 0.6), 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 黄球生效时身后发光
  if (game.buff) {
    ctx.save();
    const gl = ctx.createRadialGradient(cx, bottom - H * 0.5, 6, cx, bottom - H * 0.5, H * 0.68);
    gl.addColorStop(0, 'rgba(255,201,60,.32)');
    gl.addColorStop(1, 'rgba(255,201,60,0)');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(cx, bottom - H * 0.5, H * 0.68, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, bottom);
  ctx.scale(sx, sy);
  if (game.flash > 0.05) { ctx.shadowColor = 'rgba(255,90,90,.9)'; ctx.shadowBlur = 28 * game.flash; }
  if (ready) ctx.drawImage(bodyImg, -W / 2, -H, W, H);
  else {
    ctx.fillStyle = '#16263d';
    roundRect(ctx, -W / 2, -H, W, H, 12);
    ctx.fill();
  }
  ctx.restore();

  // 秤牌：数字挂在脚下的绳上
  const popScale = 1 + game.pop * 0.22;
  const label = fmt(game.score);
  ctx.save();
  ctx.translate(cx, bottom + 22);
  ctx.scale(popScale, popScale);
  ctx.font = 'bold 21px ' + FONT;
  const tw = ctx.measureText(label).width;
  const pw = Math.max(58, tw + 26), ph = 28;
  roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 14);
  ctx.fillStyle = game.buff ? 'rgba(64,48,12,.86)' : 'rgba(9,17,29,.82)';
  ctx.fill();
  ctx.strokeStyle = game.buff ? 'rgba(255,201,60,.95)'
    : (game.flash > 0.05 ? 'rgba(255,120,120,.95)' : 'rgba(79,209,255,.55)');
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = game.pop > 0.05 ? '#ffffff' : '#dce9ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 1);
  ctx.restore();
}

// 箭头钩爪：尖端朝向绳子方向，一眼能看出会打向哪
function drawClaw(ctx, x, y, angle, size, color, alpha) {
  const ux = Math.sin(angle), uy = Math.cos(angle);     // 前
  const px = Math.cos(angle), py = -Math.sin(angle);    // 侧
  const S = size, A = alpha === undefined ? 1 : alpha;

  ctx.save();
  ctx.globalAlpha = A;
  ctx.translate(x, y);

  ctx.beginPath();
  ctx.moveTo(ux * S, uy * S);
  ctx.lineTo(-ux * S * 0.5 + px * S * 0.78, -uy * S * 0.5 + py * S * 0.78);
  ctx.lineTo(-ux * S * 0.18, -uy * S * 0.18);
  ctx.lineTo(-ux * S * 0.5 - px * S * 0.78, -uy * S * 0.5 - py * S * 0.78);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ux * S * 0.35 + px * S * 0.5, uy * S * 0.35 + py * S * 0.5);
  ctx.lineTo(ux * S * 0.95 + px * S * 0.95, uy * S * 0.95 + py * S * 0.95);
  ctx.moveTo(ux * S * 0.35 - px * S * 0.5, uy * S * 0.35 - py * S * 0.5);
  ctx.lineTo(ux * S * 0.95 - px * S * 0.95, uy * S * 0.95 - py * S * 0.95);
  ctx.stroke();
  ctx.restore();
}

function drawHook(ctx) {
  const h = game.hook, p = CONFIG.pivot;

  // 摆动时枪管也一直露着，末端挂箭头；角度这里现算，和画面同一帧
  const swinging = h.phase === 'swing';
  const ang = swinging ? sweep(game.t) : h.angle;
  const shown = swinging ? CONFIG.hook.stub : Math.max(h.len, 8);
  const tip = { x: p.x + Math.sin(ang) * shown, y: p.y + Math.cos(ang) * shown };

  if (swinging) {
    // 拖尾（用真实历史角度，能看出往哪边走）
    for (const [dt, alpha] of [[0.055, 0.30], [0.11, 0.15]]) {
      const a = sweep(game.t - dt);
      drawClaw(ctx, p.x + Math.sin(a) * shown, p.y + Math.cos(a) * shown, a, 13, '#7fe3ff', alpha);
    }

    // 瞄准虚线：从爪尖一直铺到最大射程
    const far = { x: p.x + Math.sin(ang) * CONFIG.hook.maxLength, y: p.y + Math.cos(ang) * CONFIG.hook.maxLength };
    ctx.save();
    ctx.setLineDash([7, 11]);
    ctx.strokeStyle = 'rgba(159,232,255,.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(far.x, far.y);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.strokeStyle = h.carry ? '#ffd166' : '#9fe8ff';
  ctx.lineWidth = h.carry ? 3.4 : 2.6;
  ctx.shadowColor = h.carry ? '#ffd166' : '#4fd1ff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(tip.x, tip.y);
  ctx.stroke();
  ctx.restore();

  drawClaw(ctx, tip.x, tip.y, ang, 14, h.carry ? '#ffd166' : (game.buff ? '#ffc93c' : '#9fe8ff'), 1);
}

function drawHud(ctx) {
  const W = CONFIG.width;

  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < CONFIG.round.maxHp; i++) {
    ctx.font = '24px ' + FONT;
    ctx.fillStyle = i < game.hp ? '#ff6b6b' : 'rgba(255,107,107,.16)';
    ctx.fillText('♥', 26 + i * 27, 34);
  }

  if (game.buff) {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 19px ' + FONT;
    ctx.fillStyle = CONFIG.buff.color;
    ctx.shadowColor = CONFIG.buff.color;
    ctx.shadowBlur = 14;
    ctx.fillText('POWER!', 28, 66);
    ctx.restore();
  }

  // 下一档挪到左下角：正上方的位置让给主角立绘
  const markScale = 1 + game.markPop * 0.3;
  ctx.textAlign = 'left';
  ctx.save();
  ctx.translate(26, CONFIG.height - 24);
  ctx.scale(markScale, markScale);
  ctx.font = '13px ' + FONT;
  ctx.fillStyle = game.markPop > 0.05 ? '#8affc1' : '#7f92ad';
  ctx.textBaseline = 'middle';
  ctx.fillText('下一档 ' + fmt(game.target), 0, 0);
  ctx.restore();

  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 27px ' + FONT;
  ctx.fillStyle = game.timeLeft <= 10 ? '#ff8080' : '#9fd7ff';
  ctx.fillText(game.timeLeft.toFixed(1), W - 26, 34);
  ctx.font = '12px ' + FONT;
  ctx.fillStyle = '#7f92ad';
  ctx.fillText('剩余秒数', W - 26, 62);

  ctx.restore();
}

function drawBanner(ctx) {
  if (!game.banner) return;
  const b = game.banner;
  const alpha = clamp(game.stateT / 0.35, 0, 1);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 40px ' + FONT;
  ctx.fillStyle = b.color;
  ctx.fillText(b.title, CONFIG.width / 2, CONFIG.height / 2 - 20);
  ctx.font = '16px ' + FONT;
  ctx.fillStyle = 'rgba(232,240,255,.75)';
  ctx.fillText(b.sub, CONFIG.width / 2, CONFIG.height / 2 + 26);
  ctx.restore();
}

function draw() {
  const ctx = CTX, W = CONFIG.width, H = CONFIG.height;
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0c1728');
  bg.addColorStop(1, '#070c14');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 摆动扇区 + 两个端点刻度
  const p = CONFIG.pivot, A = CONFIG.swing.maxAngle, R = CONFIG.hook.maxLength;
  ctx.save();
  ctx.strokeStyle = 'rgba(79,209,255,.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(p.x, p.y, R, Math.PI / 2 - A, Math.PI / 2 + A);
  ctx.stroke();
  ctx.beginPath();
  for (const s of [-A, A]) {
    ctx.moveTo(p.x + Math.sin(s) * (R - 14), p.y + Math.cos(s) * (R - 14));
    ctx.lineTo(p.x + Math.sin(s) * R, p.y + Math.cos(s) * R);
  }
  ctx.strokeStyle = 'rgba(79,209,255,.28)';
  ctx.stroke();
  ctx.restore();

  for (const b of game.balls) drawBall(ctx, b);

  drawHook(ctx);
  if (game.hook.carry) {
    const tip = hookTip();
    drawBall(ctx, game.hook.carry, tip.x, tip.y + game.hook.carry.r * 0.5, 0.85);
  }

  drawBody(ctx);
  drawSay(ctx);

  for (const f of game.floats) {
    ctx.save();
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 22px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  if (game.flash > 0) {
    ctx.fillStyle = 'rgba(255,60,60,' + (game.flash * 0.22) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  drawHud(ctx);
  drawBanner(ctx);
}

/* ============================================================
   9. 覆盖层
   ============================================================ */
const ov = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovDesc = document.getElementById('ovDesc');

function showOverlay(title, desc) {
  if (!ov) return;
  if (ovTitle) ovTitle.textContent = title;
  if (ovDesc) ovDesc.textContent = desc;
  ov.classList.add('on');
}
function hideOverlay() {
  if (ov) ov.classList.remove('on');
}

const ovBtn = document.getElementById('ovBtn');
if (ovBtn) ovBtn.addEventListener('click', function () { restart(); });

/* ============================================================
   10. 输入
   ============================================================ */
canvas.addEventListener('pointerdown', function (e) {
  if (e.button !== 0 && e.button !== undefined) return;
  e.preventDefault();
  shoot();
});

window.addEventListener('keydown', function (e) {
  if (e.key === 'm' || e.key === 'M') {
    CONFIG.audio.on = !CONFIG.audio.on;
    try { localStorage.setItem('whale_audio', CONFIG.audio.on ? '1' : '0'); } catch (err) {}
    if (CONFIG.audio.on) { sfxMark(); } else { game.say = null; }
    return;
  }
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (game.state === 'over') { restart(); return; }
    shoot();
  }
});

try {
  const savedAudio = localStorage.getItem('whale_audio');
  if (savedAudio === '0') CONFIG.audio.on = false;
} catch (err) {}

/* ============================================================
   11. 启动
   ============================================================ */
game.fieldTarget = randInt(CONFIG.spawn.keepMin, CONFIG.spawn.keepMax);
game.dangerTarget = randInt(CONFIG.danger.minOnField, CONFIG.danger.maxOnField);
maintain();
hideOverlay();

let last = 0;
function frame(now) {
  // 切到后台 / 最小化 / 锁屏时整局冻结：回来接着打，不会因为离开几分钟就被判负
  if (document.hidden) { last = 0; requestAnimationFrame(frame); return; }
  if (!last) last = now;
  const dt = (now - last) / 1000;
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 对外接口（扩展/调试用） */
window.GRAPPLE = {
  CONFIG: CONFIG,
  game: game,
  step: step,
  draw: draw,
  shoot: shoot,
  restart: restart,
  refill: refill,
  maintain: maintain,
  refreshBalls: refreshBalls,
  makeBall: makeBall,
  makeHealBall: makeHealBall,
  makeBuffBall: makeBuffBall,
  spawnHeal: spawnHeal,
  spawnBuff: spawnBuff,
  valueFor: valueFor,
  fmt: fmt,
  nextTarget: nextTarget,
  updateBuff: updateBuff,
  updateHeal: updateHeal,
  dangerCount: dangerCount,
  settle: settle,
  checkMark: checkMark,
  onTimeUp: onTimeUp,
  endRound: endRound,
  sweep: sweep,
  hookTip: hookTip,
  findHit: findHit
};

})();
</script>
